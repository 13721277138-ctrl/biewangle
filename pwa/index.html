<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#247463" />
    <meta name="description" content="无账号、离线可用的安心检查清单。" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>别忘了 · 安心检查</title>
    <script>
      // Restore a deep route redirected by the GitHub Pages 404 fallback.
      (function restoreSpaRoute(location) {
        if (!location.search.startsWith("?/")) return;
        var route = location.search
          .slice(2)
          .split("&")
          .map(function decodeRoutePart(part) { return part.replace(/~and~/g, "&"); })
          .join("?");
        window.history.replaceState(null, "", location.pathname + route + location.hash);
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>“别忘了”需要启用 JavaScript 才能在本机运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
