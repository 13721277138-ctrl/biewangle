name: Verify repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Verify runtime pins
        run: pnpm runtime:check

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for browser acceptance
        run: pnpm --filter @biewangle/pwa exec playwright install --with-deps chrome

      - name: Verify authoritative content
        run: pnpm content:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run domain, persistence, UI and conformance tests
        run: pnpm test

      - name: Build production artifacts
        run: pnpm build

      - name: Verify runtime trust boundaries
        run: pnpm verify:boundaries

      - name: Verify native WeChat release structure
        run: pnpm miniprogram:verify

      - name: Run PWA browser acceptance
        run: pnpm e2e
