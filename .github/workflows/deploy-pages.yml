name: Verify and deploy PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for browser acceptance
        run: pnpm --filter @biewangle/pwa exec playwright install --with-deps chrome

      - name: Run production gate
        run: pnpm content:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm verify:boundaries && pnpm miniprogram:verify && pnpm e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pwa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
